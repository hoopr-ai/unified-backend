name: Deploy Unified Backend (Production)

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (for metadata only)
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.UNIFIED_GCP_SSH_KEY_PROD }}" > /tmp/unified-backend-key
          chmod 600 /tmp/unified-backend-key

      - name: Deploy on Production Server via SSH
        shell: bash
        env:
          SERVER_IP: ${{ secrets.UNIFIED_GCP_IP_PROD }}
          SERVER_USER: ${{ secrets.UNIFIED_GCP_USER_PROD }}
        run: |
          set -euo pipefail

          ssh -i /tmp/unified-backend-key \
              -o StrictHostKeyChecking=no \
              "$SERVER_USER@$SERVER_IP" << 'EOF'

          set -euo pipefail
          trap 'echo "❌ FAILED at: $BASH_COMMAND"; exit 1' ERR

          echo "================================================="
          echo "👤 User:"
          whoami

          echo "================================================="
          echo "📂 Initial working directory:"
          pwd

          echo "================================================="
          echo "📁 Checking base path"
          BASE_DIR="/var/www/html/unified-backend"

          if [ ! -d "$BASE_DIR" ]; then
            echo "❌ Directory does NOT exist: $BASE_DIR"
            ls -la /var/www/html || true
            exit 1
          fi

          cd
          cd ..
          cd "$BASE_DIR"

          echo "================================================="
          echo "📁 Directory contents:"
          ls -la

          echo "================================================="
          echo "📥 Pulling latest code..."
          git pull origin production

          echo "================================================="
          echo "📦 Installing dependencies..."
          npm ci --production=false

          echo "================================================="
          echo "🔨 Building project..."
          npm run build

          echo "================================================="
          echo "🔄 Restarting PM2 process (unified-backend only)..."
          APP_NAME="unified-backend"

          # Only restart this specific app - DO NOT use pm2 kill or pm2 delete all
          if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
            echo "✅ App found, reloading $APP_NAME..."
            pm2 reload "$APP_NAME" --update-env
          else
            echo "⚠️ App not found, starting with ecosystem config..."
            pm2 start ecosystem.config.cjs
          fi

          pm2 save
          echo "📊 PM2 Status:"
          pm2 status

          echo "================================================="
          echo "✅ Deployment finished successfully"
          EOF