name: Publish DB Schemas Package

on:
  push:
    branches:
      - production
    paths:
      - 'packages/db-schemas/**'
      - 'services/persistence-service/**/*.schema.ts'
      - 'services/dto-service/**/*.dto.ts'
      - 'services/dto-service/**/*.enum.ts'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUBTOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hoopr-ai'

      - name: Install dependencies
        working-directory: packages/db-schemas
        run: npm install

      - name: Bump version (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/db-schemas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.version_bump }} -m "chore(db-schemas): bump version to %s"
          git push --follow-tags

      - name: Bump patch version (auto trigger)
        if: github.event_name == 'push'
        working-directory: packages/db-schemas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore(db-schemas): bump version to %s"
          git push --follow-tags

      - name: Build package
        working-directory: packages/db-schemas
        run: npm run build

      - name: Publish to GitHub Packages
        working-directory: packages/db-schemas
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUBTOKEN }}
