name: Publish DB Schemas Package

on:
  push:
    branches:
      - staging
    paths:
      - 'packages/db-schemas/**'
      - 'services/persistence-service/**/*.schema.ts'
      - 'services/dto-service/**/*.dto.ts'
      - 'services/dto-service/**/*.enum.ts'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hoopr-ai'

      - name: Install dependencies
        working-directory: packages/db-schemas
        run: npm install

      - name: Bump version (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/db-schemas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }}
          npm version ${{ github.event.inputs.version_bump }} -m "chore(db-schemas): bump version to %s"
          git push --follow-tags

      - name: Bump patch version (auto trigger)
        if: github.event_name == 'push'
        working-directory: packages/db-schemas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }}
          npm version patch -m "chore(db-schemas): bump version to %s"
          git push --follow-tags

      - name: Build package
        working-directory: packages/db-schemas
        run: npm run build

      - name: Check if version already published
        id: version_check
        working-directory: packages/db-schemas
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Checking $PKG_NAME@$PKG_VERSION on GitHub Packages..."
          if npm view "$PKG_NAME@$PKG_VERSION" version --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "Version $PKG_VERSION already exists on registry — skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $PKG_VERSION is new — will publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: steps.version_check.outputs.exists == 'false'
        working-directory: packages/db-schemas
        run: |
          rm -f .npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
